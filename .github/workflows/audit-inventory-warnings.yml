name: Audit inventory warning data
on:
  push:
    branches: [fix/warning-evidence, feat/movement-impact-warnings]
    paths: ['scripts/audit-inventory-warnings.mjs', '.github/workflows/audit-inventory-warnings.yml']
  workflow_dispatch:
    inputs:
      movement:
        description: 'Inspect reported movement SKU without data writes'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read warning statistics
        env:
          SUPABASE_PROJECT_REF: udullprykzdskrxmbbkj
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/audit-inventory-warnings.mjs ${{ github.ref == 'refs/heads/feat/movement-impact-warnings' && '--movement-preview' || inputs.movement == true && '--movement' || '--validate' }}
