name: Audit inventory warning data
on:
  push:
    branches: [fix/warning-evidence, feat/movement-impact-warnings, fix/warning-transactions]
    paths: ['scripts/audit-inventory-warnings.mjs', '.github/workflows/audit-inventory-warnings.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only validation or movement inspection (preview installs its private review RPC)'
        type: choice
        options: [validate, movement, movement-preview, sync-health]
        default: validate
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read warning statistics
        env:
          SUPABASE_PROJECT_REF: udullprykzdskrxmbbkj
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/audit-inventory-warnings.mjs ${{ (inputs.mode == 'sync-health' || github.ref == 'refs/heads/fix/warning-transactions') && '--sync-health' || inputs.mode == 'movement' && '--movement' || inputs.mode == 'movement-preview' && '--movement-preview' || github.event_name == 'push' && github.ref == 'refs/heads/feat/movement-impact-warnings' && '--movement-preview' || '--validate' }}
