name: Deploy warning WhatsApp lifecycle
on:
  push:
    branches: [main, fix/warning-whatsapp-lifecycle, fix/warning-stable-identity]
    paths:
      - 'supabase/migrations/20261030010000_warning_observations.sql'
      - 'supabase/functions/warning-whatsapp/**'
      - 'supabase/functions/whatsapp-fonnte/**'
      - 'supabase/migrations/20261030000000_warning_partial_notifications.sql'
      - 'supabase/migrations/20261028000000_notification_user_settings.sql'
      - 'supabase/migrations/20261023000000_warning_notification_lifecycle.sql'
      - 'supabase/migrations/20261026010000_warning_notification_recovery.sql'
      - 'supabase/migrations/20261026020000_warning_resolution_freshness.sql'
      - 'supabase/migrations/20261027000000_warning_stable_identity.sql'
      - 'scripts/deploy-warning-notifications.mjs'
      - '.github/workflows/deploy-warning-notifications.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [deploy, diagnose]
        default: deploy
permissions:
  contents: read
concurrency:
  group: warning-notification-deploy
  cancel-in-progress: false
jobs:
  diagnose:
    if: inputs.mode == 'diagnose'
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: udullprykzdskrxmbbkj
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: health
        run: node scripts/deploy-warning-notifications.mjs --diagnose
      - name: 'Warning diagnostics: ${{ steps.health.outputs.result }}'
        run: echo 'Read-only notification state inspected; no messages sent.'
  deploy:
    if: inputs.mode != 'diagnose'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: udullprykzdskrxmbbkj
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      WMS_WARNING_RECIPIENTS: '628996628761'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - run: deno check supabase/functions/warning-whatsapp/index.ts
      - id: inspect
        if: github.ref != 'refs/heads/main'
        run: node scripts/deploy-warning-notifications.mjs --inspect
      - name: 'Warning validation: ${{ steps.inspect.outputs.result }}'
        if: github.ref != 'refs/heads/main'
        run: echo 'Notification state changes rolled back.'
      - if: github.ref == 'refs/heads/main'
        run: node scripts/deploy-warning-notifications.mjs --configure
      - uses: supabase/setup-cli@v1
        if: github.ref == 'refs/heads/main'
        with:
          version: '2.120.0'
      - if: github.ref == 'refs/heads/main'
        run: supabase functions deploy warning-whatsapp --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
      - if: github.ref == 'refs/heads/main'
        run: supabase functions deploy whatsapp-fonnte --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
      - id: publish
        if: github.ref == 'refs/heads/main'
        run: node scripts/deploy-warning-notifications.mjs
      - name: 'Warning delivery: ${{ steps.publish.outputs.result }}'
        if: github.ref == 'refs/heads/main'
        run: echo 'Read-only health and scheduler verified.'
