name: Deploy archive registry
on:
  push:
    branches: [main, feat/archive-source-manager]
    paths:
      - 'supabase/migrations/20261021010000_archive_spreadsheets.sql'
      - 'scripts/deploy-archive-sources.mjs'
      - '.github/workflows/deploy-archive-sources.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: archive-registry-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SUPABASE_PROJECT_REF: udullprykzdskrxmbbkj
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - id: inspect
        if: github.ref != 'refs/heads/main'
        run: node scripts/deploy-archive-sources.mjs --inspect
      - id: publish
        if: github.ref == 'refs/heads/main'
        run: node scripts/deploy-archive-sources.mjs
      - name: 'Archive registry: ${{ steps.inspect.outputs.result }}${{ steps.publish.outputs.result }}'
        run: echo 'Private archive registry checked.'
