name: Deploy NetSuite stock accuracy
on:
  push:
    branches: [main, feat/netsuite-accuracy, fix/movement-immediate-draft, fix/quick-sku-active-locations, fix/netsuite-direct-sync]
    paths:
      - 'supabase/migrations/20261020000000_netsuite_accuracy.sql'
      - 'scripts/deploy-netsuite.mjs'
      - '.github/workflows/deploy-netsuite.yml'
  schedule:
    - cron: '20,50 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: netsuite-schema
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: schema
        continue-on-error: true
        name: Inspect deployed schema or apply migration
        env:
          SUPABASE_PROJECT_REF: udullprykzdskrxmbbkj
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SHEET_ID_2026: ${{ secrets.SHEET_ID_2026 || vars.SHEET_ID_2026 }}
        run: node scripts/deploy-netsuite.mjs ${{ github.ref != 'refs/heads/main' && '--inspect' || github.event_name == 'schedule' && '--sync' || '' }}
      - name: 'Source checks: ${{ steps.schema.outputs.source_checks }}'
        if: github.ref != 'refs/heads/main'
        run: echo 'Schema inspection completed.'
      - name: 'NetSuite deployment: ${{ steps.schema.outputs.health }}'
        if: github.ref == 'refs/heads/main'
        run: echo 'NetSuite schema, first synchronization and schedule verified.'
      - name: 'Deployment state: ${{ steps.schema.outputs.deployment_state }}'
        if: always() && github.ref != 'refs/heads/main'
        run: echo 'Nonsecret deployment diagnostic.'
      - name: 'Deployment failure: ${{ steps.schema.outputs.failure }}'
        if: always() && steps.schema.outcome == 'failure'
        run: exit 1
      - name: 'Source report: ${{ steps.schema.outputs.source_report }}'
        if: always() && github.ref != 'refs/heads/main'
        run: echo 'Read-only Google report validation.'
