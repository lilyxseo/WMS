name: Verify inventory revision history
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-inventory-history.yml'
      - 'functions/api/inventory-history.js'
      - 'functions/api/_inventory-drive-revisions.js'
      - 'functions/api/_inventory-revision-xlsx.js'
      - 'assets/js/inventory-history.js'
      - 'tests/inventory-history.test.mjs'
      - 'tests/inventory-revision-xlsx.integration.mjs'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency: inventory-history-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node --test tests/inventory-history.test.mjs tests/inventory-revision-xlsx.integration.mjs
