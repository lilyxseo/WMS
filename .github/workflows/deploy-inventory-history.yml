name: Deploy inventory history
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-inventory-history.yml'
      - 'scripts/deploy-inventory-history.mjs'
      - 'supabase/migrations/20261128000000_inventory_daily_history.sql'
  workflow_dispatch:
permissions:
  contents: read
concurrency: inventory-history-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_PROJECT_REF: udullprykzdskrxmbbkj
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - if: github.ref == 'refs/heads/main'
        run: node scripts/deploy-inventory-history.mjs
