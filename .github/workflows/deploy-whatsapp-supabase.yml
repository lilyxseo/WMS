name: Deploy WhatsApp bot to Supabase

on:
  push:
    branches: [main, work]
    paths:
      - 'supabase/functions/whatsapp-fonnte/**'
      - 'supabase/functions/app-google-auth/**'
      - 'functions/api/**'
      - 'supabase/config.toml'
      - 'supabase/migrations/20261011070000_whatsapp_search_sessions.sql'
      - 'supabase/migrations/20261011160000_whatsapp_daily_deliveries.sql'
      - 'scripts/setup-whatsapp-summary.mjs'
      - 'tests/**'
      - 'assets/js/pic-config.js'
      - '.github/workflows/deploy-whatsapp-supabase.yml'
  workflow_dispatch:
    inputs:
      daily_summary_numbers:
        description: 'Optional daily summary recipients (62..., comma-separated); blank retains existing Supabase schedule'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-whatsapp-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: udullprykzdskrxmbbkj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - name: Test repository
        run: node --test tests/*.test.mjs
      - name: Check Edge Function
        run: deno check --config supabase/functions/whatsapp-fonnte/deno.json supabase/functions/whatsapp-fonnte/index.ts
      - name: Check application Gmail authentication
        run: deno check --config supabase/functions/whatsapp-fonnte/deno.json supabase/functions/app-google-auth/index.ts
      - uses: supabase/setup-cli@v1
        with:
          version: '2.120.0'
      - name: Prepare bot search context table
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          if (!process.env.SUPABASE_ACCESS_TOKEN) throw new Error('Missing SUPABASE_ACCESS_TOKEN');
          const query = await readFile('supabase/migrations/20261011070000_whatsapp_search_sessions.sql', 'utf8');
          const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.SUPABASE_PROJECT_REF}/database/query`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ query }),
            signal: AbortSignal.timeout(60000),
          });
          if (!response.ok) throw new Error(`Search context table setup failed: HTTP ${response.status}`);
          console.log('Bot search context table prepared; inventory tables unchanged.');
          JS
      - name: Configure daily WhatsApp summary
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          WHATSAPP_DAILY_SUMMARY_NUMBERS: ${{ inputs.daily_summary_numbers || vars.WHATSAPP_DAILY_SUMMARY_NUMBERS }}
        run: node scripts/setup-whatsapp-summary.mjs
      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'Add SUPABASE_ACCESS_TOKEN in GitHub repository Settings > Secrets and variables > Actions.'
            exit 1
          fi
          supabase functions deploy app-google-auth --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
          supabase functions deploy whatsapp-fonnte --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
      - name: Verify deployed webhook
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const url = `https://${process.env.SUPABASE_PROJECT_REF}.supabase.co/functions/v1/whatsapp-fonnte`;
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({}),
            signal: AbortSignal.timeout(30000),
          });
          assert.equal(response.status, 401, `Expected configured webhook to reject missing secret with 401; received ${response.status}. Check function deployment and bot secrets in Supabase.`);
          assert.deepEqual(await response.json(), { success: false });
          const authUrl = `https://${process.env.SUPABASE_PROJECT_REF}.supabase.co/functions/v1/app-google-auth`;
          const authResponse = await fetch(authUrl, { method: 'POST', signal: AbortSignal.timeout(30000) });
          assert.equal(authResponse.status, 401, 'Application Gmail endpoint must reject unauthenticated callers');
          console.log('Deployed webhook is configured and rejects unauthenticated requests.');
          JS
      - name: Verify configured Gmail authentication without spreadsheet writes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const ensure = (condition, message) => { if (!condition) console.error(`::error::${message}`); assert.ok(condition, message); };
          const project = process.env.SUPABASE_PROJECT_REF;
          const keysResponse = await fetch(`https://api.supabase.com/v1/projects/${project}/api-keys?reveal=true`, {
            headers: { Authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}` },
            signal: AbortSignal.timeout(30000),
          });
          ensure(keysResponse.ok, `Server credential lookup failed: HTTP ${keysResponse.status}`);
          const keys = await keysResponse.json();
          const key = keys.find(item => String(item.api_key || '').startsWith('sb_secret_'))?.api_key
            || keys.find(item => item.name === 'service_role')?.api_key;
          ensure(key, 'Server credential unavailable for the authenticated deployment check');
          const response = await fetch(`https://${project}.supabase.co/functions/v1/app-google-auth`, {
            method: 'POST', headers: { apikey: key, 'X-WMS-Server-Key': key },
            signal: AbortSignal.timeout(30000),
          });
          const payload = await response.json();
          const knownCode = ['OAUTH_CONFIG_MISSING', 'OAUTH_AUTHENTICATION_FAILED', 'SERVER_KEY_REJECTED', 'SERVER_KEY_INVALID'].includes(payload.code) ? payload.code : 'NO_CODE';
          ensure(response.status === 200, `Configured Gmail authentication failed: HTTP ${response.status}, ${knownCode}`);
          ensure(typeof payload.access_token === 'string' && payload.access_token, 'Google access token missing');
          console.log('Configured Gmail OAuth verified; no spreadsheet writes performed.');
          JS
