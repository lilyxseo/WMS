name: Deploy file manager
on:
  push:
    branches: [main, feat/file-manager]
    paths:
      - 'supabase/migrations/20261022000000_file_bin.sql'
      - 'scripts/deploy-file-manager.mjs'
      - '.github/workflows/deploy-file-manager.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: file-manager-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SUPABASE_PROJECT_REF: udullprykzdskrxmbbkj
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - id: inspect
        if: github.ref != 'refs/heads/main'
        run: node scripts/deploy-file-manager.mjs --inspect
      - id: publish
        if: github.ref == 'refs/heads/main'
        run: node scripts/deploy-file-manager.mjs
      - name: 'File storage: ${{ steps.inspect.outputs.result }}${{ steps.publish.outputs.result }}'
        run: echo 'Private file storage checked.'
